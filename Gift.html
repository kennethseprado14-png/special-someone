<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Song Guesser</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-full flex flex-col justify-between bg-slate-950 text-slate-100 selection:bg-pink-500 selection:text-slate-950">

    <header class="w-full border-b border-slate-800/80 bg-slate-900/50 backdrop-blur">
        <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-pink-500 text-slate-950 flex items-center justify-center font-bold">
                    <i class="fa-solid fa-music text-sm"></i>
                </div>
                <span class="font-bold text-base tracking-wide">Song Guesser</span>
            </div>

            <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
                <button id="tabPlayBtn" onclick="showTab('play')" class="px-3 py-1.5 rounded-lg bg-pink-500 text-slate-950 transition">
                    Play
                </button>
                <button id="tabEditBtn" onclick="showTab('edit')" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition">
                    Songs (<span id="songCount">0</span>)
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-xl w-full mx-auto p-4 flex flex-col justify-center relative">

        <!-- ================ PLAY TAB ================ -->
        <section id="playTab" class="flex flex-col gap-4">

            <!-- Stats Header -->
            <div class="flex items-center justify-between text-xs font-semibold text-slate-400 px-1">
                <span>Song <strong id="progressText" class="text-pink-400">1 of 5</strong></span>
                <span>Score: <strong id="scoreText" class="text-white">0</strong></span>
            </div>

            <!-- Big Audio Play Button Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col items-center justify-center gap-4 text-center">
                <button id="playAudioBtn" onclick="toggleAudio()" 
                    class="w-20 h-20 rounded-full bg-pink-500 hover:bg-pink-400 text-slate-950 flex items-center justify-center text-2xl transition-all transform active:scale-95 shadow-lg shadow-pink-500/20">
                    <i id="playIcon" class="fa-solid fa-play ml-1"></i>
                </button>
                <div>
                    <h2 id="cardStatus" class="font-bold text-base text-slate-200">Tap play to listen</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Guess the title of the track</p>
                </div>
                <audio id="audioPlayer"></audio>
            </div>

            <!-- Guess Input Form -->
            <form onsubmit="checkGuess(event)" class="flex gap-2">
                <input type="text" id="guessInput" placeholder="Type song title..." autocomplete="off"
                    class="flex-1 bg-slate-900 border border-slate-800 focus:border-pink-500 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 text-sm outline-none transition">
                <button type="submit" class="px-5 py-3 bg-pink-500 hover:bg-pink-400 text-slate-950 font-bold rounded-xl text-sm transition shrink-0">
                    Guess
                </button>
            </form>

            <!-- Feedback Box -->
            <div id="feedback" class="hidden p-3 rounded-xl text-xs font-semibold text-center transition"></div>

            <!-- Actions & Navigation -->
            <div class="flex items-center justify-between pt-1 text-xs">
                <div class="flex gap-3">
                    <button onclick="showHint()" class="text-slate-400 hover:text-blue-400 transition flex items-center gap-1">
                        <i class="fa-solid fa-lightbulb"></i> Hint
                    </button>
                    <button onclick="revealAnswer()" class="text-slate-400 hover:text-pink-400 transition flex items-center gap-1">
                        <i class="fa-solid fa-eye"></i> Answer
                    </button>
                </div>
                <div class="flex gap-2">
                    <button onclick="changeSong(-1)" class="px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-lg hover:bg-slate-800 text-slate-300">
                        <i class="fa-solid fa-chevron-left"></i> Prev
                    </button>
                    <button onclick="changeSong(1)" class="px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-lg hover:bg-slate-800 text-slate-300">
                        Next <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>

        </section>

        <!-- ================ EDIT TAB ================ -->
        <section id="editTab" class="hidden flex flex-col gap-4">

            <!-- Add Song Form -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <h3 class="font-bold text-sm text-slate-200 mb-3"><i class="fa-solid fa-plus text-pink-400 mr-1.5"></i> Add New Song</h3>
                <form onsubmit="addSong(event)" class="flex flex-col gap-2.5 text-xs">
                    <input type="text" id="newTitle" placeholder="Song Title (e.g., Ukulele)" required
                        class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-100 placeholder-slate-500 outline-none focus:border-pink-500">
                    <input type="text" id="newArtist" placeholder="Artist Name (optional hint)"
                        class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-100 placeholder-slate-500 outline-none focus:border-pink-500">
                    
                    <div class="flex gap-2 items-center">
                        <input type="url" id="newUrl" placeholder="Audio URL (https://...)" 
                            class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-100 placeholder-slate-500 outline-none focus:border-pink-500">
                        <span class="text-slate-500 font-medium">or</span>
                        <label class="px-3 py-2.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-300 font-semibold cursor-pointer shrink-0">
                            Upload MP3
                            <input type="file" id="newFile" accept="audio/*" class="hidden" onchange="handleFile(event)">
                        </label>
                    </div>

                    <button type="submit" class="w-full py-2.5 bg-pink-500 hover:bg-pink-400 text-slate-950 font-bold rounded-xl mt-1 transition">
                        Save Song
                    </button>
                </form>
            </div>

            <!-- Song List -->
            <div class="flex flex-col gap-2">
                <h4 class="text-xs font-semibold text-slate-400">Song Playlist</h4>
                <div id="songList" class="flex flex-col gap-2"></div>
            </div>

            <button onclick="resetDefaults()" class="text-center text-xs text-slate-500 hover:text-pink-400 py-2 transition">
                Reset to default songs
            </button>
        </section>

    </main>

    <!-- ================ WINNER PROPOSAL MODAL ================ -->
    <div id="winnerModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        
        <!-- Step 1: Question Box -->
        <div id="proposalStep" class="bg-slate-900 border border-pink-500/50 rounded-2xl p-6 max-w-sm w-full text-center flex flex-col items-center shadow-2xl shadow-pink-500/10">
            <div class="w-16 h-16 bg-pink-500/10 text-pink-400 rounded-full flex items-center justify-center text-3xl mb-3">
                <i class="fa-solid fa-heart text-pink-500"></i>
            </div>
            
            <h2 class="text-xl font-bold text-blue-400 mb-2">🎉 You Guessed Them All! 🎉</h2>
            <p class="text-base text-slate-200 font-medium mb-6">
                I really like you. Would you want to make things official?
            </p>

            <div class="flex flex-col gap-3 w-full">
                <button onclick="handleChoice('Be yours')" class="w-full py-3 bg-pink-500 hover:bg-pink-400 text-slate-950 font-bold rounded-xl text-sm transition shadow-lg shadow-pink-500/20">
                    Be yours
                </button>
                <button onclick="handleChoice('Be mine')" class="w-full py-3 bg-blue-500 hover:bg-blue-400 text-slate-950 font-bold rounded-xl text-sm transition shadow-lg shadow-blue-500/20">
                    Be mine
                </button>
            </div>
        </div>

        <!-- Step 2: Confirmation Box -->
        <div id="confirmationStep" class="hidden bg-slate-900 border border-blue-500/50 rounded-2xl p-6 max-w-sm w-full text-center flex flex-col items-center shadow-2xl shadow-blue-500/10">
            <div class="w-16 h-16 bg-blue-500/10 text-blue-400 rounded-full flex items-center justify-center text-3xl mb-3">
                <i class="fa-solid fa-heart text-blue-400"></i>
            </div>
            
            <h2 class="text-2xl font-bold text-pink-400 mb-2">
                I'm excited about our relationship! ❤️
            </h2>
            <p class="text-sm text-slate-300 mb-6">
                Looking forward to our next chapter together!
            </p>

            <button onclick="restartGame()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl text-sm transition">
                Play Again
            </button>
        </div>

    </div>

    <script>
        const DB_NAME = 'SongGuesserDB';
        const STORE_NAME = 'songs';

        function openDB() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) {
                    reject('IndexedDB not supported');
                    return;
                }
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveSongsToDB(songsList) {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                await store.clear();
                for (const song of songsList) {
                    store.put(song);
                }
            } catch (err) {
                console.warn('IndexedDB save failed:', err);
            }
        }

        async function loadSongsFromDB() {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                return new Promise((resolve) => {
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(null);
                });
            } catch (err) {
                return null;
            }
        }

        // Exactly 5 default songs
        const DEFAULT_SONGS = [
            { id: '1', title: 'Ukulele', artist: 'Benjamin Tissot', audioUrl: 'https://www.bensound.com/bensound-music/bensound-ukulele.mp3' },
            { id: '2', title: 'Creative Minds', artist: 'Bensound', audioUrl: 'https://www.bensound.com/bensound-music/bensound-creativeminds.mp3' },
            { id: '3', title: 'Energy', artist: 'Benjamin Tissot', audioUrl: 'https://www.bensound.com/bensound-music/bensound-energy.mp3' },
            { id: '4', title: 'Cute', artist: 'Bensound', audioUrl: 'https://www.bensound.com/bensound-music/bensound-cute.mp3' },
            { id: '5', title: 'Acoustic Breeze', artist: 'Benjamin Tissot', audioUrl: 'https://www.bensound.com/bensound-music/bensound-acousticbreeze.mp3' }
        ];

        let songs = [];
        let currentIndex = 0;
        let score = 0;
        let isPlaying = false;
        let pendingFileUrl = '';
        let solvedSongs = new Set();
        const player = document.getElementById('audioPlayer');

        window.addEventListener('DOMContentLoaded', async () => {
            await loadSongs();
            loadRound();
        });

        async function loadSongs() {
            try {
                const dbSongs = await loadSongsFromDB();
                if (dbSongs && dbSongs.length > 0) {
                    songs = dbSongs;
                } else {
                    const saved = localStorage.getItem('simple_songs_data');
                    songs = saved ? JSON.parse(saved) : [...DEFAULT_SONGS];
                }
            } catch (e) {
                songs = [...DEFAULT_SONGS];
            }
            const countEl = document.getElementById('songCount');
            if (countEl) countEl.innerText = songs.length;
        }

        async function saveSongs() {
            const countEl = document.getElementById('songCount');
            if (countEl) countEl.innerText = songs.length;

            await saveSongsToDB(songs);

            try {
                localStorage.setItem('simple_songs_data', JSON.stringify(songs));
            } catch (err) {
                console.warn('LocalStorage quota exceeded. Song stored via IndexedDB instead.');
            }
        }

        function loadRound() {
            stopAudio();
            hideFeedback();
            document.getElementById('guessInput').value = '';

            if (!songs.length) {
                document.getElementById('progressText').innerText = '0 / 0';
                document.getElementById('cardStatus').innerText = 'No songs available';
                return;
            }

            if (currentIndex >= songs.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = songs.length - 1;

            const song = songs[currentIndex];
            player.src = song.audioUrl;
            document.getElementById('progressText').innerText = `${currentIndex + 1} of ${songs.length}`;
            document.getElementById('scoreText').innerText = score;
            document.getElementById('cardStatus').innerText = 'Tap play to listen';
        }

        function toggleAudio() {
            if (isPlaying) {
                stopAudio();
            } else {
                if (!player.src) return;
                player.play().then(() => {
                    isPlaying = true;
                    document.getElementById('playIcon').className = 'fa-solid fa-pause';
                    document.getElementById('cardStatus').innerText = 'Playing clip...';
                }).catch(() => {
                    showFeedback('Unable to play audio URL or file', 'error');
                });
            }
        }

        function stopAudio() {
            player.pause();
            isPlaying = false;
            document.getElementById('playIcon').className = 'fa-solid fa-play ml-1';
            if (songs.length) document.getElementById('cardStatus').innerText = 'Tap play to listen';
        }

        function checkGuess(e) {
            e.preventDefault();
            const input = document.getElementById('guessInput').value.trim();
            if (!input || !songs.length) return;

            const current = songs[currentIndex];
            const cleanUser = input.toLowerCase().replace(/[^a-z0-9]/g, '');
            const cleanTarget = current.title.toLowerCase().replace(/[^a-z0-9]/g, '');

            if (cleanUser === cleanTarget || (cleanTarget.includes(cleanUser) && cleanUser.length >= 3)) {
                if (!solvedSongs.has(current.id)) {
                    score += 20; // 20 points per song (total 100 for 5 songs)
                    solvedSongs.add(current.id);
                }
                document.getElementById('scoreText').innerText = score;
                showFeedback(`Correct! It's "${current.title}"`, 'success');

                // Trigger popup if 5th/last song is solved (music keeps playing)
                if (currentIndex === songs.length - 1) {
                    setTimeout(() => {
                        triggerWinner();
                    }, 800);
                }
            } else {
                showFeedback('Wrong guess, try again!', 'error');
            }
        }

        function triggerWinner() {
            // Keep audio playing in the background
            document.getElementById('proposalStep').classList.remove('hidden');
            document.getElementById('confirmationStep').classList.add('hidden');
            document.getElementById('winnerModal').classList.remove('hidden');
        }

        function handleChoice(choice) {
            document.getElementById('proposalStep').classList.add('hidden');
            document.getElementById('confirmationStep').classList.remove('hidden');
        }

        function restartGame() {
            stopAudio();
            document.getElementById('winnerModal').classList.add('hidden');
            currentIndex = 0;
            score = 0;
            solvedSongs.clear();
            loadRound();
        }

        function showHint() {
            if (!songs.length) return;
            const song = songs[currentIndex];
            const hint = song.artist ? `Artist: ${song.artist}` : `Starts with "${song.title.charAt(0)}"`;
            showFeedback(`Hint: ${hint}`, 'info');
        }

        function revealAnswer() {
            if (!songs.length) return;
            showFeedback(`Answer: "${songs[currentIndex].title}"`, 'info');
        }

        function changeSong(step) {
            currentIndex += step;
            loadRound();
        }

        function showFeedback(msg, type) {
            const fb = document.getElementById('feedback');
            fb.classList.remove('hidden', 'bg-pink-500/10', 'text-pink-400', 'bg-red-500/10', 'text-red-400', 'bg-slate-800', 'text-slate-300');
            fb.innerText = msg;
            if (type === 'success') fb.classList.add('bg-pink-500/10', 'text-pink-400');
            else if (type === 'error') fb.classList.add('bg-red-500/10', 'text-red-400');
            else fb.classList.add('bg-slate-800', 'text-slate-300');
        }

        function hideFeedback() {
            document.getElementById('feedback').classList.add('hidden');
        }

        function showTab(tab) {
            stopAudio();
            const playTab = document.getElementById('playTab');
            const editTab = document.getElementById('editTab');
            const tabPlayBtn = document.getElementById('tabPlayBtn');
            const tabEditBtn = document.getElementById('tabEditBtn');

            if (tab === 'play') {
                playTab.classList.remove('hidden');
                editTab.classList.add('hidden');
                tabPlayBtn.className = 'px-3 py-1.5 rounded-lg bg-pink-500 text-slate-950 transition';
                tabEditBtn.className = 'px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition';
                loadRound();
            } else {
                playTab.classList.add('hidden');
                editTab.classList.remove('hidden');
                tabEditBtn.className = 'px-3 py-1.5 rounded-lg bg-pink-500 text-slate-950 transition';
                tabPlayBtn.className = 'px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition';
                renderSongList();
            }
        }

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                pendingFileUrl = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function addSong(e) {
            e.preventDefault();
            const title = document.getElementById('newTitle').value.trim();
            const artist = document.getElementById('newArtist').value.trim();
            const url = document.getElementById('newUrl').value.trim();
            const finalUrl = pendingFileUrl || url;

            if (!finalUrl) {
                showFeedback('Please enter an Audio URL or upload an MP3 file.', 'error');
                return;
            }

            songs.push({ id: Date.now().toString(), title, artist, audioUrl: finalUrl });
            
            try {
                await saveSongs();
                showFeedback('Song saved successfully!', 'success');
            } catch (err) {
                showFeedback('Song added for session (storage limit reached)', 'info');
            }

            document.getElementById('newTitle').value = '';
            document.getElementById('newArtist').value = '';
            document.getElementById('newUrl').value = '';
            document.getElementById('newFile').value = '';
            pendingFileUrl = '';

            renderSongList();
        }

        async function deleteSong(id) {
            songs = songs.filter(s => s.id !== id);
            await saveSongs();
            renderSongList();
        }

        function renderSongList() {
            const list = document.getElementById('songList');
            list.innerHTML = '';
            if (!songs.length) {
                list.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">No songs added yet.</p>`;
                return;
            }

            songs.forEach((s) => {
                const item = document.createElement('div');
                item.className = 'bg-slate-900 border border-slate-800 rounded-xl p-3 flex items-center justify-between text-xs';
                item.innerHTML = `
                    <div class="truncate">
                        <strong class="text-slate-200 block truncate">${s.title}</strong>
                        <span class="text-slate-400 truncate">${s.artist || 'Unknown Artist'}</span>
                    </div>
                    <button onclick="deleteSong('${s.id}')" class="text-red-400 hover:text-red-300 p-1.5">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;
                list.appendChild(item);
            });
        }

        function resetDefaults() {
            songs = [...DEFAULT_SONGS];
            saveSongs();
            renderSongList();
        }
    </script>
</body>
</html>
